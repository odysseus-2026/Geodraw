<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何图解 GeoDraw · 高中数学几何题自动画图</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-cn">几何图解</span>
    <span class="brand-en">GeoDraw</span>
    <span class="brand-sub">高中数学 · 几何题自动画图</span>
  </div>
  <div class="top-right">
    <span class="lib-badge" id="libVer">规则库 v—</span>
    <button class="top-btn" id="btnChangelog">更新记录</button>
    <button class="top-btn" id="btnGuide">升级指引</button>
    <button class="top-btn" id="btnFeedback">提交反馈</button>
  </div>
</header>

<main class="layout">

  <!-- 左：控制面板 -->
  <aside class="panel">

    <section class="sec">
      <div class="sec-head"><span class="sec-no">01</span><h2>输入题目</h2></div>
      <textarea id="ta" rows="6" placeholder="输入或粘贴几何题，例如：&#10;在△ABC中，已知B=120°，AC=√19，AB=2&#10;&#10;快捷键 ⌘/Ctrl + Enter 直接生成"></textarea>
      <div class="input-row">
        <button class="btn ghost" id="btnVoice" title="语音输入">语音</button>
        <button class="btn ghost" id="btnImage" title="拍照/截图识别">图片</button>
        <button class="btn primary" id="btnSolve">生成图形 →</button>
      </div>
      <input type="file" id="fileImg" accept="image/*" hidden>
      <div class="voice-hint" id="voiceHint">读出题目，自动转为文字（需允许麦克风）</div>
      <div class="ocr-wrap" id="ocrWrap" style="display:none">
        <img id="imgPrev" alt="题目图片预览">
        <div class="ocr-track"><div class="ocr-bar" id="ocrBar"></div></div>
        <div class="ocr-msg" id="ocrMsg"></div>
      </div>
    </section>

    <section class="sec">
      <div class="sec-head"><span class="sec-no">02</span><h2>识别报告</h2></div>
      <div class="report" id="report"><div class="rep-line rep-idle">等待输入题目…</div></div>
    </section>

    <section class="sec">
      <div class="sec-head"><span class="sec-no">03</span><h2>演示测试</h2><button class="btn ghost sm" id="btnRunAll">运行全部</button></div>
      <div class="sec-tip">5 道高考真题 + 4 道移植能力题 · 点击单题或一键全部测试</div>
      <div class="demo-list" id="demoList"></div>
      <div class="test-summary" id="testSummary"></div>
    </section>

    <section class="sec">
      <div class="sec-head"><span class="sec-no">04</span><h2>待升级队列 <em id="queueCount">0</em></h2></div>
      <div class="sec-tip">无法识别的题目自动记录在此；导出后交给 Kimi 即可扩充规则库</div>
      <div class="queue-list" id="queueList"></div>
      <div class="input-row">
        <button class="btn ghost" id="btnExport">导出升级包</button>
        <button class="btn ghost" id="btnClear">清空</button>
      </div>
    </section>

    <footer class="panel-foot">队列数据仅保存在本浏览器 localStorage</footer>
  </aside>

  <!-- 右：图形舞台 -->
  <section class="stage">
    <div class="stage-bar">
      <div class="seg">
        <span class="seg-item" id="segPlane">平面图形</span>
        <span class="seg-item" id="segSolid">立体图形</span>
      </div>
      <div class="stage-notes" id="stageNotes"></div>
    </div>
    <div class="stage-body">
      <div class="stage-2d" id="stage2d" style="display:none"></div>
      <div class="stage-3d" id="stage3d" style="display:none"></div>
      <div class="stage-empty" id="stageEmpty">
        <div class="empty-grid"></div>
        <p class="empty-title">图形将在这里生成</p>
        <p class="empty-sub">左侧输入几何题 → 点击「生成图形」<br>或在 03 区直接运行 9 道演示题</p>
      </div>
      <div class="hint-3d" id="hint3d" style="display:none">拖拽旋转 · 滚轮缩放</div>
    </div>
  </section>

</main>

<div class="modal" id="modal" style="display:none">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">×</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/patterns.js"></script>
<script src="js/geom2d.js"></script>
<script src="js/geom3d.js"></script>
<script src="js/engine.js"></script>
<script src="js/inputs.js"></script>
<script src="js/demo.js"></script>
<script>
document.getElementById('btnFeedback').addEventListener('click', function () {
  // TODO: 把下面链接替换为你们组的 GitHub 仓库 Issues 地址
  window.open('https://github.com/odysseus-2026/geodraw/issues/new', '_blank');
});
</script>
<script src="js/app.js"></script>
</body>
</html>
